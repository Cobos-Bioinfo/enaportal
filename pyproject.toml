[project]
name = "enaportal"
version = "0.1.0.dev0"
description = "A typed Python client for the ENA Portal and Browser APIs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Alejandro Cobos" }]
keywords = ["ena", "embl-ebi", "bioinformatics", "sequencing", "api-client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
]

[project.scripts]
enaportal = "enaportal.cli:main"

[project.urls]
Homepage = "https://github.com/Cobos-Bioinfo/enaportal"
Repository = "https://github.com/Cobos-Bioinfo/enaportal"
Issues = "https://github.com/Cobos-Bioinfo/enaportal/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enaportal"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The `not live` filter is what actually keeps the default run offline; the
# marker alone does not exclude anything. `pytest -m live` overrides it.
addopts = "-q --strict-markers -m 'not live'"
markers = [
    # Tests that hit the live ENA API. Excluded from the default run; the
    # scheduled schema-drift workflow runs them with `-m live`.
    "live: requires network access to www.ebi.ac.uk",
]

[tool.coverage.run]
source = ["enaportal"]
branch = true
# Only ever run as a subprocess, which coverage does not follow.
omit = ["*/enaportal/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    # The fallback for a source tree that was never installed.
    "except PackageNotFoundError:",
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "scripts"]
